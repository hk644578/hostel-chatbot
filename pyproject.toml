[project]
name = "hostel-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jaskaran Singh", email = "323jaskaransingh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
]

[project.scripts]
hostel-project = "hostel_project:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
